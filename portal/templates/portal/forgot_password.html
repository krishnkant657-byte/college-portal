<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS Academy - Reset Password</title>
    
    <!-- Modern Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #eceef0; 
            --bg-surface: #ffffff; 
            --text-primary: #111827; 
            --text-secondary: #6b7280; 
            
            --accent-primary: #111827; 
            
            --border-color: #f3f4f6;
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.03);
            --shadow-float: 0 10px 30px rgba(0, 0, 0, 0.06);
            --danger: #ef4444;
            --success: #10b981;
            
            --radius-card: 24px;
            --radius-btn: 14px;
        }

        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: var(--text-primary);
        }
        
        .card { 
            background: var(--bg-surface); 
            padding: 40px; 
            border-radius: var(--radius-card); 
            box-shadow: var(--shadow-float); 
            width: 100%; 
            max-width: 440px; 
        }
        
        h2 { 
            text-align: center; 
            color: var(--text-primary); 
            margin-bottom: 8px; 
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid transparent; 
            background-color: var(--bg-body); 
            border-radius: var(--radius-btn); 
            box-sizing: border-box; 
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        input::placeholder { color: #a1a1aa; font-weight: 400; }
        input:focus { outline: none; border-color: var(--text-primary); background-color: var(--bg-surface); }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            background-color: var(--accent-primary); 
            color: white; 
            border: none; 
            border-radius: var(--radius-btn); 
            cursor: pointer; 
            font-size: 1.05rem; 
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
        
        .alert { padding: 14px 16px; border-radius: var(--radius-btn); font-size: 0.9rem; font-weight: 500; margin-bottom: 24px; text-align: center; }
        .alert-error { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .alert-success { background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <p class="subtitle">Securely recover your account access.</p>
        
        {% if error %} <div class="alert alert-error">{{ error }}</div> {% endif %}
        {% if success %} <div class="alert alert-success">{{ success }}</div> {% endif %}

        {% if step == 1 %}
        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="hidden" name="step" value="1">
            <div class="form-group">
                <label for="username">Enter 5-Digit Computer Code</label>
                <input type="text" id="username" name="username" required placeholder="Computer Code" autocomplete="off">
            </div>
            <button type="submit" class="btn">Send OTP Code</button>
        </form>

        {% elif step == 2 %}
        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="hidden" name="step" value="2">
            <div class="form-group">
                <label for="otp">Enter 6-Digit OTP</label>
                <input type="text" id="otp" name="otp" required placeholder="Check your email">
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required placeholder="Enter new password">
            </div>
            <button type="submit" class="btn">Verify & Change</button>
        </form>
        {% endif %}
        
        <a href="{% url 'login_view' %}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>

</body>
</html>
