<div class="animate-fade-in" style="background-color: var(--bg-surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 550px; margin: 40px auto; text-align: left; border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 60px; height: 60px; background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.5rem;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 style="color: var(--text-primary); font-size: 1.5rem; font-weight: 700; margin-bottom: 5px;">Secure Payment Gateway</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Complete your transaction to finalize the exam form.</p>
    </div>

    <div style="background-color: var(--bg-body); padding: 20px; border-radius: 12px; margin-bottom: 30px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span style="color: var(--text-secondary); font-weight: 500;">Enrollment No.</span>
            <span style="color: var(--text-primary); font-weight: 600;">{{ profile.enrollment_number }}</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span style="color: var(--text-secondary); font-weight: 500;">Form Type</span>
            <span style="color: var(--text-primary); font-weight: 600;">{{ record.form_type }} Examination</span>
        </div>
        <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px dashed var(--border-color);">
            <span style="color: var(--text-primary); font-weight: 700;">Total Amount</span>
            <span style="color: #3b82f6; font-weight: 800; font-size: 1.2rem;">₹ 2,450.00</span>
        </div>
    </div>

    <form id="paymentForm" onsubmit="processPayment(event, {{ record.id }})">
        {% csrf_token %}
        
        <div style="margin-bottom: 25px;">
            <label style="display: block; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;">Select Payment Method</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <label style="border: 2px solid #3b82f6; border-radius: 12px; padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px; background-color: rgba(59, 130, 246, 0.05);">
                    <input type="radio" name="payment_method" checked style="accent-color: #3b82f6;">
                    <span style="font-weight: 600;"><i class="fa-brands fa-google-pay" style="font-size: 1.2rem;"></i> UPI</span>
                </label>
                <label style="border: 2px solid var(--border-color); border-radius: 12px; padding: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px;">
                    <input type="radio" name="payment_method" style="accent-color: #3b82f6;">
                    <span style="font-weight: 600;"><i class="fa-solid fa-credit-card"></i> Card</span>
                </label>
            </div>
        </div>

        <button type="submit" style="width: 100%; background-color: #3b82f6; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px;">
            <i class="fa-solid fa-lock"></i> Pay Securely
        </button>
    </form>
</div>

<script>
    function processPayment(e, recordId) {
        e.preventDefault();
        
        const form = document.getElementById('paymentForm');
        const formData = new FormData(form);
        const contentWorkspace = document.querySelector('.workspace-content');
        
        // Show Payment Processing Animation
        contentWorkspace.innerHTML = `
            <div class="animate-fade-in" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh;">
                <div style="position: relative; width: 80px; height: 80px; margin-bottom: 20px;">
                    <div style="position: absolute; width: 100%; height: 100%; border: 4px solid #f3f4f6; border-radius: 50%;"></div>
                    <div style="position: absolute; width: 100%; height: 100%; border: 4px solid #3b82f6; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite;"></div>
                </div>
                <h3 style="color: var(--text-primary); font-weight:700; font-size: 1.5rem; margin-bottom: 5px;">Processing Payment</h3>
                <p style="color: var(--text-secondary);">Please do not close this window or press back...</p>
            </div>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        `;
        
        // Add a fake 2 second delay to simulate bank processing so the user sees the animation!
        setTimeout(() => {
            fetch('/process-payment/' + recordId + '/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.text())
            .then(htmlMarkup => {
                contentWorkspace.innerHTML = `<div class="module-card animate-fade-in">${htmlMarkup}</div>`;
            })
            .catch(err => {
                console.error(err);
            });
        }, 2000);
    }
</script>
